name: Marvel Tech (Mufan Power)
description: >-
  Marvel Tech (Mufan Power, 慕帆动力) is a Chinese industrial power-equipment
  manufacturer developing next-generation zero-carbon clean power-generation
  technology and products. Its portfolio centers on hydrogen-fuelled gas
  turbine generating sets, high-speed multi-stage cantilever turbines,
  special-gas and TRT flow-path (通流) turbines, dry low-NOx combustors, and
  industrial waste-heat and waste-pressure recovery equipment. The company runs
  a corporate brochure website in Chinese and English (ICP 沪ICP备17001438号) and
  publishes no public developer, API, or SDK surface. It was surfaced as a
  portfolio company of Qiming and added to the API Evangelist network.
